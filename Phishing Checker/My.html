<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing URL Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url("Phishing1.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding-top: 50px;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 400px;
            max-width: 90%;
        }
        h2 {
            color: #333;
        }
        input {
            width: 90%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #aaa;
            font-size: 16px;
        }
        button {
            margin-top: 15px;
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.6;
        }
        #reasons {
            margin-top: 10px;
            font-size: 14px;
            text-align: left;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Phishing URL Detector</h2>
        <input
            type="text"
            id="urlInput"
            placeholder="Enter a URL..."
        >
        <br>
        <button onclick="checkURL()">Check URL</button>
        <div id="result"></div>
        <div id="reasons"></div>
    </div>
    <script>
        function checkURL() {
            const input = document.getElementById("urlInput").value.trim();
            const result = document.getElementById("result");
            const reasonsDiv = document.getElementById("reasons");
            result.innerHTML = "";
            reasonsDiv.innerHTML = "";
            // Check if input is empty
            if (input === "") {
                result.innerHTML = "⚠️ Please enter a URL.";
                result.style.color = "orange";
                return;
            }
            let url;
            // Add http:// if protocol is missing
            let formattedURL = input;
            if (!formattedURL.match(/^https?:\/\//i)) {
                formattedURL = "http://" + formattedURL;
            }
            // Validate URL
            try {
                url = new URL(formattedURL);
            } catch (error) {
                result.innerHTML = "❌ Invalid URL.";
                result.style.color = "red";
                return;
            }
            let score = 0;
            let reasons = [];
            const hostname = url.hostname.toLowerCase();
            const fullURL = url.href.toLowerCase();
            // 1. Check URL length
            if (fullURL.length > 75) {
                score += 2;
                reasons.push("Very long URL");
            }
            // 2. Check HTTPS
            if (url.protocol !== "https:") {
                score += 1;
                reasons.push("Does not use HTTPS");
            }
            // 3. Check for IP address
            const ipPattern = /^(?:\d{1,3}\.){3}\d{1,3}$/;
            if (ipPattern.test(hostname)) {
                score += 3;
                reasons.push("Uses an IP address instead of a domain name");
            }
            // 4. Check for @ symbol
            if (fullURL.includes("@")) {
                score += 3;
                reasons.push("Contains @ symbol");
            }
            // 5. Check number of dots/subdomains
            const domainParts = hostname.split(".");
            if (domainParts.length > 3) {
                score += 2;
                reasons.push("Contains many subdomains");
            }
            // 6. Check suspicious words
            const suspiciousWords = [
                "login",
                "verify",
                "verification",
                "update",
                "confirm",
                "secure",
                "account",
                "password",
                "bank",
                "free",
                "signin",
                "wallet",
                "suspended"
            ];
            let foundWords = [];
            suspiciousWords.forEach(function(word) {
                if (fullURL.includes(word)) {
                    foundWords.push(word);
                }
            });
            if (foundWords.length >= 2) {
                score += 3;
                reasons.push(
                    "Multiple suspicious words found: " +
                    foundWords.join(", ")
                );
            }
            else if (foundWords.length === 1) {
                score += 1;
                reasons.push(
                    "Suspicious word found: " +
                    foundWords[0]
                );
            }
            // 7. Check hyphens in hostname
            const hyphens = (hostname.match(/-/g) || []).length;

            if (hyphens >= 2) {
                score += 2;
                reasons.push("Multiple hyphens in domain");
            }
            // 8. Check hostname length
            if (hostname.length > 40) {
                score += 2;
                reasons.push("Unusually long domain name");
            }
            // 9. Check encoded characters
            if (/%[0-9A-F]{2}/i.test(fullURL)) {
                score += 1;
                reasons.push("Contains encoded characters");
            }
            // 10. Check unusual ports
            if (url.port !== "" &&
                url.port !== "80" &&
                url.port !== "443") {
                score += 1;
                reasons.push("Uses an unusual port number");
            }
            // Display result
            if (score >= 7) {
                result.innerHTML =
                    "🚨 SUSPICIOUS URL<br>Risk Score: " + score;
                result.style.color = "red";
            }
            else if (score >= 4) {
                result.innerHTML =
                    "⚠️ POTENTIALLY SUSPICIOUS<br>Risk Score: " + score;
                result.style.color = "orange";
            }
            else {
                result.innerHTML =
                    "✅ NO OBVIOUS PHISHING SIGNS<br>Risk Score: " + score;
                result.style.color = "green";
            }
            // Display reasons
            if (reasons.length > 0) {
                reasonsDiv.innerHTML =
                    "<strong>Detection details:</strong><br>• " +
                    reasons.join("<br>• ");
            }
            else {
                reasonsDiv.innerHTML =
                    "No suspicious patterns were detected.";
            }
        }
        // Allow Enter key to check URL
        document
            .getElementById("urlInput")
            .addEventListener("keypress", function(event) {
                if (event.key === "Enter") {
                    checkURL();
                }
            });
    </script>
</body>
</html>
